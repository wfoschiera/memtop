name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Run tests
        run: >-
          uv run --python ${{ matrix.python-version }}
          --with pytest
          --with psutil
          --with rich
          --with typer
          pytest -v
