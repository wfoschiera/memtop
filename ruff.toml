# Standalone ruff config (no pyproject.toml needed — memtop stays single-file).
target-version = "py311"
line-length = 100

# The CLI lives in an extension-less file (`memtop`); ruff would skip it otherwise.
extend-include = ["memtop"]

[lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: bugbear, C4: comprehensions
select = ["E", "W", "F", "I", "UP", "B", "C4"]
